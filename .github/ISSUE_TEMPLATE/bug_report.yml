name: Bug report
description: Report a build, probe, SocketCAN, RX or TX problem
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing waveUSBCAN_b. For safety-critical buses, do not include instructions to transmit guessed control frames.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Distro, kernel, adapter USB ID, DKMS version.
      render: text
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands run
      render: bash
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Include dmesg tail, DKMS make.log, candump snippets if relevant.
      render: text
    validations:
      required: true
